<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão Matemática • 5º ano</title><style>:root{font-family:system-ui,Arial;background:#f4f6ff;color:#24304a}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#5044b8,#168fa6);color:white;padding:30px 20px}header>div,main{max-width:1050px;margin:auto}h1{margin:0;font-size:2rem}header p{opacity:.95}.stats{display:flex;gap:12px;flex-wrap:wrap}.pill{background:#ffffff25;padding:9px 15px;border-radius:30px}main{padding:24px 16px 80px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:650}.tab{background:white;color:#3d398c;border:1px solid #dfe1f2}.tab.active{background:#4e46ad;color:white}.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 25px #2222440d;margin-bottom:18px}.explain{background:#eef7ff;border-left:5px solid #168fa6;padding:17px;border-radius:12px;line-height:1.7}.example{background:#fff8e7;border-left:5px solid #e9a32b;padding:14px;border-radius:10px;margin-top:12px}.quiz{margin-top:18px}.question{border-top:1px solid #e4e7f2;padding:20px 0}.question h3{font-size:1.05rem;margin:0 0 12px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.answer{background:#f5f6fc;text-align:left;border:2px solid transparent;font-weight:500}.answer:hover{border-color:#938ce0}.answer.selected{background:#e5e1ff;border-color:#6154c5}.answer.correct{background:#dff7e7;border-color:#258451}.answer.wrong{background:#ffe5e5;border-color:#d54b4b}.feedback{margin:10px 0;font-weight:600}.primary{background:#4e46ad;color:white}.secondary{background:#e9ebfa;color:#343477}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.progress{height:12px;background:#e4e7f2;border-radius:10px;overflow:hidden}.bar{height:100%;background:#32a99b;transition:width .3s}.small{font-size:.92rem;color:#59647b}.hidden{display:none}footer{text-align:center;color:#68728b;padding:20px}@media(max-width:600px){.answers{grid-template-columns:1fr}.card{padding:17px}h1{font-size:1.6rem}}</style></head><body><header><div><h1>🚀 Missão Matemática — 5º ano</h1><p>Aprenda, pratique e conquiste estrelas em cada missão!</p><div class="stats"><span class="pill" id="stars">⭐ 0 pontos</span><span class="pill" id="done">📚 0 de 7 missões concluídas</span></div></div></header><main><nav class="tabs" id="tabs" aria-label="Conteúdos"></nav><section class="card" id="lesson"></section><section class="card"><h2>🧠 Hora de praticar!</h2><p class="small">Escolha uma resposta para cada questão e clique em Corrigir. Você pode tentar novamente.</p><div class="progress"><div class="bar" id="bar"></div></div><div class="quiz" id="quiz"></div><div class="actions"><button class="primary" id="check">Corrigir respostas</button><button class="secondary" id="retry">Tentar novamente</button><button class="secondary" id="next">Próxima missão →</button></div><p id="result" aria-live="polite"></p></section></main><footer>Feito para aprender Matemática com autonomia e diversão ✨</footer><script>
const lessons=[
{title:'Testes de divisibilidade',emoji:'🔎',theory:'Um número é divisível por outro quando a divisão é exata, ou seja, o resto é zero.<br>• <b>Por 2:</b> termina em 0, 2, 4, 6 ou 8.<br>• <b>Por 3:</b> a soma dos algarismos é múltipla de 3.<br>• <b>Por 4:</b> os dois últimos algarismos formam um múltiplo de 4.<br>• <b>Por 5:</b> termina em 0 ou 5.<br>• <b>Por 6:</b> é divisível por 2 e por 3.<br>• <b>Por 9:</b> a soma dos algarismos é múltipla de 9.<br>• <b>Por 10:</b> termina em 0.',example:'Exemplo: 234 é divisível por 2 porque termina em 4 e por 3 porque 2 + 3 + 4 = 9. Portanto, também é divisível por 6.',q:[['Qual número é divisível por 3?',['124','231','215','401'],1,'2 + 3 + 1 = 6, que é múltiplo de 3.'],['Qual número é divisível por 4?',['318','522','736','914'],2,'Os dois últimos algarismos de 736 formam 36, divisível por 4.'],['Qual número é divisível por 6?',['135','246','325','411'],1,'246 é par e 2 + 4 + 6 = 12.'],['Qual número é divisível por 9?',['729','722','713','731'],0,'7 + 2 + 9 = 18.']]},
{title:'Partilha em duas partes desiguais',emoji:'⚖️',theory:'Partilhar é dividir uma quantidade. Quando as partes são desiguais, precisamos descobrir quanto cada pessoa recebe.<br><b>Se uma parte tem uma quantidade a mais:</b> subtraímos a diferença do total e dividimos o restante em duas partes iguais. Depois somamos a diferença à parte maior.',example:'Exemplo: 38 figurinhas; Ana recebe 6 a mais que Bia. Parte menor = (38 − 6) ÷ 2 = 16. Parte maior = 16 + 6 = 22. Conferência: 16 + 22 = 38.',q:[['50 balas são divididas entre duas crianças. Uma recebe 10 a mais. Qual é a menor parte?',['15','20','25','30'],1,'(50 − 10) ÷ 2 = 20.'],['Em uma partilha de 64 reais, uma pessoa recebe 16 reais a mais. Qual é a maior parte?',['24','32','40','48'],2,'(64 − 16) ÷ 2 + 16 = 40.'],['Duas turmas juntaram 72 livros. Uma trouxe 12 a mais. Quantos livros trouxe a outra, que trouxe menos?',['30','36','42','24'],0,'(72 − 12) ÷ 2 = 30.'],['Uma parte vale 18 e a outra vale 26. Qual é a diferença?',['6','7','8','44'],2,'26 − 18 = 8.']]},
{title:'Escrevendo expressões',emoji:'✍️',theory:'Expressões numéricas representam situações usando números e operações. Use parênteses para mostrar o que deve ser calculado primeiro.<br><b>Ordem:</b> 1º parênteses; 2º multiplicação e divisão, da esquerda para a direita; 3º adição e subtração, da esquerda para a direita.',example:'Exemplo: “O triplo da soma de 8 e 4” → 3 × (8 + 4) = 36. Já “o triplo de 8 mais 4” → 3 × 8 + 4 = 28.',q:[['O dobro da soma de 7 e 5 é representado por:',['2 × 7 + 5','2 × (7 + 5)','7 + (2 × 5)','(7 + 5) ÷ 2'],1,'Primeiro somamos 7 e 5; depois multiplicamos por 2.'],['Quanto vale 30 − (6 + 4) × 2?',['10','40','20','50'],0,'6 + 4 = 10; 10 × 2 = 20; 30 − 20 = 10.'],['“A metade de 18 somada a 7” é:',['18 ÷ (2 + 7)','18 × 2 + 7','18 ÷ 2 + 7','(18 + 7) ÷ 2'],2,'Primeiro a metade de 18, depois mais 7.'],['Qual o valor de 8 + 12 ÷ 4 × 2?',['10','14','16','20'],1,'12 ÷ 4 × 2 = 6; 8 + 6 = 14.']]},
{title:'Partilhas desiguais',emoji:'🎁',theory:'Também podemos repartir quantidades em partes proporcionais. Quando a razão é 2 para 3, por exemplo, o total corresponde a 5 partes iguais. Dividimos o total por 5 e multiplicamos por 2 e por 3.',example:'Exemplo: repartir 60 adesivos na razão 2:3. São 2 + 3 = 5 partes. Cada parte vale 60 ÷ 5 = 12. As quantidades são 24 e 36.',q:[['Repartindo 40 na razão 1:3, a menor parte é:',['10','15','20','30'],0,'40 ÷ (1 + 3) = 10.'],['Repartindo 70 na razão 2:5, a maior parte é:',['20','35','50','60'],2,'70 ÷ 7 = 10; 5 × 10 = 50.'],['Em uma divisão na razão 3:4, quantas partes iguais existem no total?',['1','7','12','4'],1,'3 + 4 = 7 partes.'],['90 figurinhas na razão 4:5: quanto vale a menor quantidade?',['30','40','45','50'],1,'90 ÷ 9 = 10; 4 × 10 = 40.']]},
{title:'Padrões e regularidades',emoji:'🧩',theory:'Uma sequência apresenta um padrão quando seus termos seguem uma regra. A regra pode ser somar, subtrair, multiplicar, dividir ou alternar operações. Observe a diferença entre os termos antes de completar a sequência.',example:'Exemplo: 4, 9, 14, 19, ... A regra é somar 5. O próximo termo é 24.',q:[['Complete: 6, 12, 18, 24, ...',['28','30','32','36'],1,'A regra é somar 6.'],['Complete: 3, 6, 12, 24, ...',['30','36','48','54'],2,'A regra é multiplicar por 2.'],['Complete: 100, 90, 80, 70, ...',['50','60','65','75'],1,'A regra é subtrair 10.'],['Qual é o 5º termo da sequência 2, 5, 8, 11, ...?',['12','13','14','15'],2,'A regra é somar 3: 2, 5, 8, 11, 14.']]},
{title:'Múltiplos e restos',emoji:'🔢',theory:'Os múltiplos de um número são obtidos multiplicando-o por 0, 1, 2, 3...<br>Ao dividir um número natural por outro diferente de zero, escrevemos: <b>dividendo = divisor × quociente + resto</b>. O resto sempre é menor que o divisor.<br>Por exemplo, ao dividir por 5, os restos possíveis são 0, 1, 2, 3 e 4. Números que são múltiplos de 5 deixam resto zero.',example:'Exemplo: 23 ÷ 5 = 4 e resto 3, pois 23 = 5 × 4 + 3. O próximo múltiplo de 5 é 25.',q:[['Qual é o resto de 29 ÷ 4?',['0','1','2','3'],1,'4 × 7 = 28, então sobra 1.'],['Qual número é múltiplo de 7?',['30','35','38','41'],1,'7 × 5 = 35.'],['Qual resto NÃO pode aparecer numa divisão por 6?',['0','3','5','6'],3,'O resto deve ser menor que o divisor.'],['Qual é o resto de 43 ÷ 5?',['1','2','3','4'],2,'43 = 5 × 8 + 3.']]},
{title:'Frações',emoji:'🍕',theory:'Fração representa partes iguais de um inteiro ou de uma quantidade. O <b>numerador</b> indica quantas partes consideramos e o <b>denominador</b> indica em quantas partes iguais o inteiro foi dividido.<br>Para encontrar uma fração de uma quantidade, dividimos pelo denominador e multiplicamos pelo numerador.<br>Frações equivalentes representam a mesma quantidade: 1/2 = 2/4. Para somar frações de mesmo denominador, somamos os numeradores.',example:'Exemplo: 3/4 de 28 = (28 ÷ 4) × 3 = 21. E 2/8 + 3/8 = 5/8.',q:[['Quanto é 3/5 de 40?',['8','16','24','30'],2,'40 ÷ 5 × 3 = 24.'],['Qual fração equivale a 1/2?',['2/3','3/6','1/4','4/6'],1,'3/6 pode ser simplificada para 1/2.'],['Quanto é 2/7 + 3/7?',['5/14','6/7','5/7','1/7'],2,'Somamos os numeradores e mantemos o denominador.'],['Uma pizza foi dividida em 8 fatias iguais. Foram comidas 3. Que fração sobrou?',['3/8','4/8','5/8','8/5'],2,'Sobraram 8 − 3 = 5 fatias: 5/8.']]}];
let current=0,answers={},graded=false;let best=JSON.parse(localStorage.getItem('missaoMat5')||'{}');const $=id=>document.getElementById(id);function totals(){let scores=Object.values(best);$('stars').textContent='⭐ '+scores.reduce((a,b)=>a+b,0)+' pontos';$('done').textContent='📚 '+scores.length+' de 7 missões concluídas'}function render(){graded=false;answers={};let l=lessons[current];$('tabs').innerHTML=lessons.map((x,i)=>`<button class="tab ${i===current?'active':''}" data-i="${i}">${x.emoji} ${x.title}${best[i]!==undefined?' ✓':''}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()});$('lesson').innerHTML=`<h2>${l.emoji} ${l.title}</h2><div class="explain">${l.theory}</div><div class="example"><b>💡 Exemplo resolvido:</b><br>${l.example}</div>`;$('quiz').innerHTML=l.q.map((q,i)=>`<div class="question" id="q${i}"><h3>${i+1}. ${q[0]}</h3><div class="answers">${q[1].map((a,j)=>`<button class="answer" data-q="${i}" data-a="${j}">${String.fromCharCode(65+j)}) ${a}</button>`).join('')}</div><p class="feedback" id="f${i}" aria-live="polite"></p></div>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(graded)return;answers[b.dataset.q]=+b.dataset.a;document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');progress()});$('result').textContent='';progress();totals()}function progress(){$('bar').style.width=(Object.keys(answers).length/4*100)+'%'}$('check').onclick=()=>{if(Object.keys(answers).length<4){$('result').textContent='Responda às quatro questões antes de corrigir!';return}if(graded)return;graded=true;let score=0;lessons[current].q.forEach((q,i)=>{let ok=answers[i]===q[2];if(ok)score++;document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{let a=+b.dataset.a;if(a===q[2])b.classList.add('correct');else if(a===answers[i])b.classList.add('wrong')});$('f'+i).textContent=(ok?'✅ Acertou! ':'💡 Vamos aprender: ')+q[3]});best[current]=Math.max(best[current]||0,score*25);localStorage.setItem('missaoMat5',JSON.stringify(best));$('result').textContent=`${score===4?'🏆 Excelente!':score>=2?'👏 Bom trabalho!':'💪 Continue praticando!'} Você acertou ${score} de 4 questões e fez ${score*25} pontos nesta tentativa.`;totals()};$('retry').onclick=render;$('next').onclick=()=>{current=(current+1)%lessons.length;render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
