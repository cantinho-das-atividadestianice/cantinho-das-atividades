<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão Ciências | 5º ano | Tia Nice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f9f8;color:#203d42;font:16px system-ui,Arial}.wrap{max-width:820px;margin:auto;padding:20px 14px 50px}header{background:linear-gradient(110deg,#116b76,#31a69b);color:white;border-radius:20px;padding:25px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}header p{line-height:1.5}.panel{background:white;border-radius:18px;padding:25px;margin-top:18px;box-shadow:0 5px 22px #125b5914}#count{font-weight:800;color:#116b76}.track{height:11px;background:#e1efed;border-radius:20px;overflow:hidden;margin:16px 0 22px}#bar{background:#1ba698;height:100%;width:0;transition:width .2s}h2{font-size:22px;line-height:1.4}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #d7e9e6;border-radius:12px;padding:14px;margin:9px 0;font:inherit;cursor:pointer}.choice:hover:not(:disabled){background:#ecfaf7;border-color:#20a89b}.choice.good{background:#e2f7e8;border-color:#25925a}.choice.bad{background:#ffeded;border-color:#c45454}.choice:disabled{cursor:default}.letter{font-weight:900;color:#117a75;margin-right:9px}.feedback{background:#eaf5fa;padding:16px;border-radius:12px;margin:15px 0;line-height:1.6}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}button.primary{background:#117c78;color:white;border:0;border-radius:11px;padding:13px 21px;font:inherit;font-weight:750;cursor:pointer}button.primary:disabled{opacity:.45}button.secondary{background:white;color:#116b76;border:2px solid #add6d2;border-radius:11px;padding:12px 18px;font:inherit;cursor:pointer}.hidden{display:none}.score{font-size:48px;font-weight:900;color:#117c78}.review{border-bottom:1px solid #e3eded;padding:13px 0;line-height:1.5}footer{text-align:center;color:#5e7e7c;padding:20px}@media(max-width:520px){.panel{padding:17px}.actions button{width:100%}}
</style></head><body><main class="wrap"><header><div>🔬 CANTINHO DAS ATIVIDADES • TIA NICE</div><h1>Missão Ciências!</h1><p>5º ano • 20 questões sobre corpo humano, água, meio ambiente, energia e natureza.</p></header><section class="panel" id="game"><div id="count"></div><div class="track"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" onclick="restart()">Recomeçar</button><button id="next" class="primary" onclick="advance()" disabled>Próxima questão →</button></div></section><section id="result" class="panel hidden"><h2>Missão concluída!</h2><div class="score" id="score"></div><p id="message"></p><h3>Revisão das respostas</h3><div id="review"></div><button class="primary" onclick="restart()">Refazer quiz</button></section><footer>Material educativo • Ciências • 5º ano</footer></main><script>
const questions=[{"q": "Qual órgão bombeia o sangue pelo corpo?", "o": ["Coração", "Pulmão", "Estômago", "Rim"], "a": 0, "e": "O coração impulsiona o sangue pelos vasos sanguíneos."}, {"q": "Onde ocorre a maior parte da absorção dos nutrientes?", "o": ["Intestino grosso", "Intestino delgado", "Boca", "Esôfago"], "a": 1, "e": "A maior parte dos nutrientes é absorvida no intestino delgado."}, {"q": "Qual é a principal função dos pulmões?", "o": ["Filtrar urina", "Bombear sangue", "Realizar trocas gasosas", "Digerir alimentos"], "a": 2, "e": "Nos pulmões ocorrem trocas de oxigênio e gás carbônico."}, {"q": "Qual atitude ajuda a prevenir doenças?", "o": ["Compartilhar copos", "Beber água não tratada", "Deixar alimentos descobertos", "Lavar as mãos com água e sabão"], "a": 3, "e": "Lavar as mãos reduz a transmissão de muitos microrganismos."}, {"q": "Qual órgão filtra o sangue e produz urina?", "o": ["Rins", "Coração", "Pulmões", "Estômago"], "a": 0, "e": "Os rins filtram o sangue e eliminam resíduos pela urina."}, {"q": "O que é evaporação?", "o": ["Passagem do líquido para o sólido", "Passagem do líquido para o gasoso", "Passagem do gasoso para o líquido", "Passagem do sólido para o líquido"], "a": 1, "e": "Evaporação é a passagem da água líquida para o estado gasoso."}, {"q": "Como se chama a transformação de vapor em gotinhas de água?", "o": ["Fusão", "Solidificação", "Condensação", "Evaporação"], "a": 2, "e": "Condensação é a passagem do vapor de água para o estado líquido."}, {"q": "Qual processo participa da formação das nuvens?", "o": ["Queima de combustíveis", "Derretimento de rochas", "Filtração do solo", "Condensação do vapor de água"], "a": 3, "e": "Nuvens se formam quando o vapor de água se condensa em gotículas ou cristais."}, {"q": "Qual fonte de energia é renovável?", "o": ["Vento", "Carvão mineral", "Petróleo", "Gás natural"], "a": 0, "e": "O vento é uma fonte de energia renovável."}, {"q": "Qual atitude evita desperdício de água?", "o": ["Tomar banhos longos", "Consertar vazamentos", "Deixar torneiras abertas", "Lavar calçada com mangueira"], "a": 1, "e": "Consertar vazamentos reduz o desperdício de água tratada."}, {"q": "O que é reciclar?", "o": ["Queimar lixo em casa", "Misturar todos os resíduos", "Transformar resíduos em matéria-prima para novos produtos", "Jogar resíduos nos rios"], "a": 2, "e": "Reciclagem transforma resíduos em matéria-prima para novos produtos."}, {"q": "Quem produz alimento por fotossíntese em uma cadeia alimentar?", "o": ["Leões", "Fungos decompositores", "Seres humanos", "Plantas verdes"], "a": 3, "e": "Plantas verdes produzem matéria orgânica por fotossíntese."}, {"q": "Qual é o papel dos decompositores?", "o": ["Decompor restos e devolver nutrientes ao ambiente", "Produzir luz solar", "Impedir a chuva", "Formar rochas instantaneamente"], "a": 0, "e": "Decompositores, como fungos e bactérias, reciclam nutrientes."}, {"q": "Qual astro fornece a maior parte da luz e do calor recebidos pela Terra?", "o": ["Vênus", "Sol", "Lua", "Marte"], "a": 1, "e": "O Sol é a principal fonte de energia para a Terra."}, {"q": "O movimento de rotação da Terra provoca principalmente o quê?", "o": ["Mudança das estações do ano", "Fases da Lua", "Alternância entre dia e noite", "Formação das montanhas"], "a": 2, "e": "A rotação da Terra causa a alternância entre dia e noite."}, {"q": "Qual material costuma ser atraído por um ímã?", "o": ["Vidro", "Papel", "Madeira", "Ferro"], "a": 3, "e": "O ferro pode ser atraído por ímãs."}, {"q": "Qual opção apresenta uma alimentação mais variada?", "o": ["Frutas, verduras, grãos e fontes de proteína", "Somente doces", "Apenas refrigerantes", "Somente salgadinhos"], "a": 0, "e": "Uma alimentação variada inclui diferentes grupos de alimentos."}, {"q": "Qual é a função do sistema digestório?", "o": ["Produzir movimentos dos braços", "Transformar alimentos e absorver nutrientes", "Controlar os sentidos", "Transportar oxigênio pelo ar"], "a": 1, "e": "O sistema digestório processa alimentos e absorve nutrientes."}, {"q": "O que acontece quando inspiramos?", "o": ["O ar entra no estômago", "O ar se transforma em alimento", "O ar entra nos pulmões", "O ar sai dos pulmões"], "a": 2, "e": "Na inspiração, o ar entra nas vias respiratórias e chega aos pulmões."}, {"q": "Qual atitude ajuda a preservar o ambiente?", "o": ["Jogar pilhas no lixo comum", "Despejar óleo na pia", "Queimar plástico", "Separar resíduos e entregar pilhas em pontos de coleta"], "a": 3, "e": "Separar resíduos e descartar pilhas corretamente reduz contaminação."}];let i=0,points=0,answers=[],locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;$('game').classList.remove('hidden');$('result').classList.add('hidden');$('count').textContent=`Questão ${i+1} de ${questions.length} • ${points} acerto(s)`;$('bar').style.width=(100*i/questions.length)+'%';$('question').textContent=questions[i].q;$('options').innerHTML='';$('feedback').classList.add('hidden');$('next').disabled=true;$('next').textContent=i===questions.length-1?'Ver resultado →':'Próxima questão →';questions[i].o.forEach((opt,j)=>{let b=document.createElement('button');b.className='choice';let s=document.createElement('span');s.className='letter';s.textContent=String.fromCharCode(65+j)+')';b.append(s,document.createTextNode(' '+opt));b.onclick=()=>choose(j);$('options').appendChild(b)})}
function choose(j){if(locked)return;locked=true;let q=questions[i];if(j===q.a)points++;answers.push(j);[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('good');else if(k===j)b.classList.add('bad')});$('feedback').classList.remove('hidden');$('feedback').textContent=(j===q.a?'🌟 Muito bem! ':'💡 Vamos aprender! ')+q.e;$('next').disabled=false;$('bar').style.width=(100*(i+1)/questions.length)+'%'}
function advance(){if(!locked)return;i++;if(i<questions.length)render();else finish()}
function finish(){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=points+' / '+questions.length;$('message').textContent=points===20?'Excelente! Você acertou todas!':points>=15?'Muito bem! Continue aprendendo!':'Cada tentativa é uma oportunidade de aprender. Revise e tente novamente!';$('review').innerHTML='';questions.forEach((q,k)=>{let d=document.createElement('div');d.className='review';let t=document.createElement('strong');t.textContent=(k+1)+'. '+q.q;let p=document.createElement('p');p.textContent='Sua resposta: '+q.o[answers[k]]+' | Resposta correta: '+q.o[q.a];let e=document.createElement('small');e.textContent=q.e;d.append(t,p,e);$('review').appendChild(d)});window.scrollTo(0,0)}
function restart(){i=0;points=0;answers=[];render();window.scrollTo(0,0)}render();</script></body></html>
