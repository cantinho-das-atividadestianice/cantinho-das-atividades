<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura da Divisão • 2º Ano</title><style>
:root{--ink:#28314e;--pink:#e85594;--purple:#7157c8;--bg:#fff7ee;--green:#137d57}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(110deg,#fce1ed,#e6e2ff);padding:28px 20px} .wrap{max-width:1060px;margin:auto}.hero{display:flex;align-items:center;gap:24px;justify-content:space-between}.hero h1{font-size:clamp(28px,5vw,46px);margin:0}.hero p{font-size:18px}.girl{width:165px;min-width:110px;filter:drop-shadow(0 7px 3px #c4a5bb66)}.pill{display:inline-block;background:white;padding:7px 13px;border-radius:30px;color:#744b9c;font-weight:800;margin-bottom:10px}main{padding:22px 16px 50px}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.tab{border:2px solid #e4dbea;background:white;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:750;color:var(--ink)}.tab.active{background:#6e58c5;color:white;border-color:#6e58c5}.panel{background:white;border-radius:22px;padding:22px;margin-top:20px;box-shadow:0 5px 20px #6a50751c}.lesson{background:#f1edff;padding:18px;border-radius:15px;line-height:1.65;font-size:18px}.counter{font-weight:750;color:#6b56ba;margin:20px 0 8px}.question{font-size:clamp(20px,3vw,26px);font-weight:800;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.choice{background:#fffaf6;border:2px solid #e5dbe9;border-radius:14px;padding:16px;cursor:pointer;font-size:20px;font-weight:800;color:#27314d}.choice:hover{border-color:#a18af0}.choice.selected{background:#eae4ff;border-color:#7057c8}.choice:disabled{cursor:default}.feedback{padding:16px;border-radius:14px;background:#f1f7f4;border-left:5px solid var(--green);line-height:1.5;font-size:17px}.feedback.bad{background:#fff1f1;border-color:#d44b62}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button.action{border:0;background:var(--pink);color:white;padding:13px 20px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}button.action.secondary{background:#6e58c5}button.action:disabled{opacity:.45;cursor:not-allowed}.progress{height:13px;border-radius:20px;background:#e9e1e9;overflow:hidden;margin:10px 0}.bar{height:100%;background:#60b99b;width:0;transition:width .25s}.stats{display:flex;gap:20px;flex-wrap:wrap;font-weight:800}.tiny{font-size:14px;color:#62657b}footer{text-align:center;padding:24px}.hide{display:none}@media(max-width:520px){.girl{width:105px}.choices{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><header><div class="wrap hero"><div><span class="pill">🌟 Matemática • 2º ano</span><h1>Aventura da Divisão</h1><p>Aprenda com a Lili! 📚 Explicações simples, exemplos e 30 desafios divertidos.</p></div><svg class="girl" viewBox="0 0 180 230" role="img" aria-label="Menininha de cabelo liso segurando um livro"><ellipse cx="91" cy="220" rx="60" ry="8" fill="#bba7d3" opacity=".35"/><path d="M56 64 Q43 5 91 9 Q142 7 127 80 L135 137 L48 137Z" fill="#3b2938"/><circle cx="91" cy="70" r="42" fill="#eab18e"/><path d="M49 63 Q48 9 91 15 Q135 10 132 64 Q120 49 118 37 Q96 58 52 53Z" fill="#3b2938"/><path d="M51 66 L48 145 L66 145 L68 75M127 65 L134 145 L116 145 L115 75" fill="#3b2938"/><circle cx="76" cy="74" r="3.5" fill="#2f2632"/><circle cx="106" cy="74" r="3.5" fill="#2f2632"/><path d="M82 91 Q91 99 101 91" stroke="#a24e5a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="64" cy="87" r="7" fill="#ec8f91" opacity=".5"/><circle cx="117" cy="87" r="7" fill="#ec8f91" opacity=".5"/><path d="M63 116 Q91 101 119 116 L137 190 L44 190Z" fill="#ed6a9e"/><path d="M62 118 L36 158 L60 166 M119 118 L146 159 L124 168" stroke="#eab18e" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M65 183 L65 213 M112 183 L112 213" stroke="#eab18e" stroke-width="16"/><path d="M53 212 L75 212 M102 212 L123 212" stroke="#6655a8" stroke-width="13" stroke-linecap="round"/><rect x="55" y="139" width="74" height="47" rx="5" fill="#7058ca" transform="rotate(-7 92 162)"/><text x="75" y="169" fill="white" font-size="23" font-weight="bold">÷</text><path d="M53 154 L61 163 M126 153 L119 162" stroke="#eab18e" stroke-width="9" stroke-linecap="round"/></svg></div></header><main class="wrap"><div class="stats"><span id="total">⭐ Acertos: 0/30</span><span id="done">📝 Respondidas: 0/30</span></div><div class="progress"><div class="bar" id="bar"></div></div><p class="tiny">Escolha um conteúdo. Leia a explicação antes de responder!</p><nav class="nav" id="nav"></nav><section class="panel"><h2 id="title"></h2><div class="lesson" id="lesson"></div><div class="counter" id="counter"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div id="feedback"></div><div class="actions"><button class="action" id="check">Conferir resposta ✓</button><button class="action secondary" id="next">Próxima questão →</button><button class="action secondary" id="reset">Recomeçar tudo ↺</button></div></section></main><footer>Feito para aprender no seu ritmo 💗 • Funciona sem internet</footer><script>
const sections=[["Repartir igualmente", "Dividir é repartir em grupos com a mesma quantidade. Exemplo: 12 balas para 3 crianças: 12 ÷ 3 = 4 balas para cada uma."], ["Quanto cabe?", "Também podemos dividir para descobrir quantos grupos cabem. Exemplo: 15 lápis em caixas de 5: 15 ÷ 5 = 3 caixas."], ["Multiplicação e divisão", "São operações inversas: 4 × 3 = 12, então 12 ÷ 3 = 4. A multiplicação ajuda a conferir a divisão."], ["Metade", "Metade é dividir em 2 partes iguais. Exemplo: metade de 14 é 14 ÷ 2 = 7."], ["Terça parte", "A terça parte é dividir em 3 partes iguais. Exemplo: a terça parte de 15 é 15 ÷ 3 = 5."], ["As quatro operações", "Em problemas, descubra se precisa juntar (+), tirar (−), formar grupos iguais (×) ou repartir (÷). Leia com atenção!"], ["Maneiras de dividir", "Podemos usar desenhos, grupos, contagem ou multiplicação. Exemplo: 24 ÷ 4 = 6, porque 4 × 6 = 24."]];const questions=[{"section": 0, "q": "12 figurinhas serão repartidas igualmente entre 3 crianças. Quantas cada uma recebe?", "a": 4, "why": "12 ÷ 3 = 4. Cada criança recebe 4.", "options": [3, 4, 5, 6]}, {"section": 0, "q": "16 figurinhas serão repartidas igualmente entre 4 crianças. Quantas cada uma recebe?", "a": 4, "why": "16 ÷ 4 = 4. Cada criança recebe 4.", "options": [3, 4, 5, 6]}, {"section": 0, "q": "10 figurinhas serão repartidas igualmente entre 2 crianças. Quantas cada uma recebe?", "a": 5, "why": "10 ÷ 2 = 5. Cada criança recebe 5.", "options": [4, 5, 6, 7]}, {"section": 0, "q": "18 figurinhas serão repartidas igualmente entre 3 crianças. Quantas cada uma recebe?", "a": 6, "why": "18 ÷ 3 = 6. Cada criança recebe 6.", "options": [5, 6, 7, 8]}, {"section": 0, "q": "20 figurinhas serão repartidas igualmente entre 5 crianças. Quantas cada uma recebe?", "a": 4, "why": "20 ÷ 5 = 4. Cada criança recebe 4.", "options": [3, 4, 5, 6]}, {"section": 1, "q": "Temos 12 objetos. Colocando 4 em cada caixa, quantas caixas serão usadas?", "a": 3, "why": "12 ÷ 4 = 3 caixas.", "options": [2, 3, 4, 5]}, {"section": 1, "q": "Temos 20 objetos. Colocando 5 em cada caixa, quantas caixas serão usadas?", "a": 4, "why": "20 ÷ 5 = 4 caixas.", "options": [3, 4, 5, 6]}, {"section": 1, "q": "Temos 18 objetos. Colocando 6 em cada caixa, quantas caixas serão usadas?", "a": 3, "why": "18 ÷ 6 = 3 caixas.", "options": [2, 3, 4, 5]}, {"section": 1, "q": "Temos 16 objetos. Colocando 2 em cada caixa, quantas caixas serão usadas?", "a": 8, "why": "16 ÷ 2 = 8 caixas.", "options": [7, 8, 9, 10]}, {"section": 2, "q": "Se 3 × 4 = 12, quanto é 12 ÷ 4?", "a": 3, "why": "3 × 4 = 12. Por isso, 12 ÷ 4 = 3.", "options": [2, 3, 4, 5]}, {"section": 2, "q": "Se 5 × 2 = 10, quanto é 10 ÷ 2?", "a": 5, "why": "5 × 2 = 10. Por isso, 10 ÷ 2 = 5.", "options": [4, 5, 6, 7]}, {"section": 2, "q": "Se 4 × 5 = 20, quanto é 20 ÷ 5?", "a": 4, "why": "4 × 5 = 20. Por isso, 20 ÷ 5 = 4.", "options": [3, 4, 5, 6]}, {"section": 2, "q": "Se 2 × 6 = 12, quanto é 12 ÷ 6?", "a": 2, "why": "2 × 6 = 12. Por isso, 12 ÷ 6 = 2.", "options": [1, 2, 3, 4]}, {"section": 3, "q": "Qual é a metade de 14?", "a": 7, "why": "Metade é dividir por 2: 14 ÷ 2 = 7.", "options": [6, 7, 8, 9]}, {"section": 3, "q": "Qual é a metade de 20?", "a": 10, "why": "Metade é dividir por 2: 20 ÷ 2 = 10.", "options": [9, 10, 11, 12]}, {"section": 3, "q": "Qual é a metade de 8?", "a": 4, "why": "Metade é dividir por 2: 8 ÷ 2 = 4.", "options": [3, 4, 5, 6]}, {"section": 3, "q": "Qual é a metade de 18?", "a": 9, "why": "Metade é dividir por 2: 18 ÷ 2 = 9.", "options": [8, 9, 10, 11]}, {"section": 4, "q": "Qual é a terça parte de 15?", "a": 5, "why": "Terça parte é dividir por 3: 15 ÷ 3 = 5.", "options": [4, 5, 6, 7]}, {"section": 4, "q": "Qual é a terça parte de 12?", "a": 4, "why": "Terça parte é dividir por 3: 12 ÷ 3 = 4.", "options": [3, 4, 5, 6]}, {"section": 4, "q": "Qual é a terça parte de 21?", "a": 7, "why": "Terça parte é dividir por 3: 21 ÷ 3 = 7.", "options": [6, 7, 8, 9]}, {"section": 4, "q": "Qual é a terça parte de 9?", "a": 3, "why": "Terça parte é dividir por 3: 9 ÷ 3 = 3.", "options": [2, 3, 4, 5]}, {"section": 6, "q": "Quanto é 24 ÷ 4?", "a": 6, "why": "24 ÷ 4 = 6, pois 6 × 4 = 24.", "options": [5, 6, 7, 8]}, {"section": 6, "q": "Quanto é 30 ÷ 5?", "a": 6, "why": "30 ÷ 5 = 6, pois 6 × 5 = 30.", "options": [5, 6, 7, 8]}, {"section": 6, "q": "Quanto é 28 ÷ 4?", "a": 7, "why": "28 ÷ 4 = 7, pois 7 × 4 = 28.", "options": [6, 7, 8, 9]}, {"section": 6, "q": "Quanto é 18 ÷ 2?", "a": 9, "why": "18 ÷ 2 = 9, pois 9 × 2 = 18.", "options": [8, 9, 10, 11]}, {"section": 5, "q": "Ana tinha 8 lápis e ganhou mais 7. Quantos lápis tem agora?", "a": 15, "why": "Juntar é somar: 8 + 7 = 15.", "options": [14, 15, 16, 17]}, {"section": 5, "q": "Havia 19 maçãs e 6 foram comidas. Quantas sobraram?", "a": 13, "why": "Tirar é subtrair: 19 − 6 = 13.", "options": [12, 13, 14, 15]}, {"section": 5, "q": "Há 4 mesas com 3 cadeiras em cada. Quantas cadeiras?", "a": 12, "why": "Grupos iguais: 4 × 3 = 12.", "options": [11, 12, 13, 14]}, {"section": 5, "q": "24 biscoitos para 6 amigos. Quantos para cada?", "a": 4, "why": "Repartir igualmente: 24 ÷ 6 = 4.", "options": [3, 4, 5, 6]}, {"section": 5, "q": "Pedro tinha 12 carrinhos e deu 5. Com quantos ficou?", "a": 7, "why": "12 − 5 = 7.", "options": [6, 7, 8, 9]}];let section=0,position=0,selected=null;let saved={};try{saved=JSON.parse(localStorage.getItem('divisao2ano30')||'{}')}catch(e){}const $=id=>document.getElementById(id);const indexes=s=>questions.map((q,i)=>q.section===s?i:-1).filter(i=>i>=0);function persist(){localStorage.setItem('divisao2ano30',JSON.stringify(saved))}function render(){const ids=indexes(section),idx=ids[position],q=questions[idx];$('nav').innerHTML=sections.map((s,i)=>`<button class="tab ${i===section?'active':''}" data-i="${i}">${i+1}. ${s[0]} (${indexes(i).length})</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{section=+b.dataset.i;position=0;selected=null;render()});$('title').textContent=sections[section][0];$('lesson').textContent=sections[section][1];$('counter').textContent=`Questão ${position+1} de ${ids.length} deste conteúdo`; $('question').textContent=q.q;let old=saved[idx];selected=old?old.choice:null;$('choices').innerHTML=q.options.map(o=>`<button class="choice ${selected===o?'selected':''}" data-v="${o}" ${old?'disabled':''}>${o}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected=+b.dataset.v;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b))});$('feedback').innerHTML=old?`<div class="feedback ${old.choice===q.a?'':'bad'}"><b>${old.choice===q.a?'🎉 Muito bem!':'💡 Vamos aprender!'}</b><p>${q.why}</p></div>`:'';$('check').disabled=!!old;$('next').textContent=position===ids.length-1?'Ir para o próximo conteúdo →':'Próxima questão →';const keys=Object.keys(saved);$('done').textContent=`📝 Respondidas: ${keys.length}/30`;$('total').textContent=`⭐ Acertos: ${keys.filter(k=>saved[k].choice===questions[k].a).length}/30`;$('bar').style.width=(keys.length/30*100)+'%'}$('check').onclick=()=>{const idx=indexes(section)[position];if(selected===null){alert('Escolha uma resposta primeiro!');return}saved[idx]={choice:selected};persist();render()};$('next').onclick=()=>{if(position<indexes(section).length-1)position++;else{section=(section+1)%sections.length;position=0}selected=null;render();document.querySelector('.panel').scrollIntoView({behavior:'smooth'})};$('reset').onclick=()=>{if(confirm('Apagar todas as respostas e recomeçar?')){saved={};persist();section=0;position=0;render()}};render();
</script></body></html>
