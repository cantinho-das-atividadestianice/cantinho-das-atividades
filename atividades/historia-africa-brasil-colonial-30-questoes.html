<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz de História — Unidades 9 e 10</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#253248;background:#f3f5fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:760px;margin:35px auto}.panel{background:white;border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 36px #25324817}.eyebrow{font-weight:800;color:#5763b8;letter-spacing:.08em;font-size:13px}h1{font-size:clamp(25px,5vw,38px);line-height:1.2;margin:12px 0}h2{font-size:clamp(20px,4vw,27px);line-height:1.4}p{color:#667085;line-height:1.6}.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#667085;margin-bottom:15px}.progress{height:9px;background:#e8eaf4;border-radius:10px;overflow:hidden}.bar{height:100%;background:#5763b8;transition:width .2s}.option{display:flex;align-items:center;gap:14px;padding:16px;border:2px solid #e5e7ef;border-radius:14px;margin:12px 0;cursor:pointer;text-align:left;font:inherit;width:100%;background:white;color:inherit}.option:hover{border-color:#5763b8;background:#f7f7ff}.option.selected{border-color:#5763b8;background:#eef0ff}.letter{font-weight:800;color:#5763b8}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}button.action{background:#5763b8;border:0;color:white;padding:13px 22px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}button.action.secondary{background:#e9ebf5;color:#39435c}button:disabled{opacity:.4;cursor:not-allowed}.score{text-align:center;font-size:54px;color:#5763b8;font-weight:800}.review{border-top:1px solid #e5e7ef;padding:16px 0}.review strong{display:block;margin-bottom:6px}.correct{color:#15734b}.wrong{color:#bd3842}.footer{text-align:center;margin-top:20px;font-size:12px;color:#667085}@media(max-width:500px){body{padding:12px}.wrap{margin:8px auto}.panel{border-radius:16px}.actions button{flex:1}}</style></head><body><main class="wrap"><section class="panel" id="app"></section><div class="footer">Quiz de História • Unidades 9 e 10 • 30 questões</div></main><script>const data=[{"q": "Por que a África não pode ser considerada um continente de cultura única?", "options": ["Porque possui apenas uma língua", "Porque reúne povos, línguas e tradições diferentes", "Porque todas as sociedades surgiram juntas", "Porque não existiam sociedades organizadas"], "answer": 1, "unit": 9}, {"q": "Qual atividade era tradicionalmente praticada por muitos grupos san?", "options": ["Cultivo de cana-de-açúcar", "Construção de portos", "Caça e coleta", "Comércio atlântico"], "answer": 2, "unit": 9}, {"q": "Qual era uma importante atividade tradicional de muitos grupos khoi-khoi?", "options": ["Pastoreio de animais", "Fabricação de automóveis", "Extração de petróleo", "Plantio de café"], "answer": 0, "unit": 9}, {"q": "Qual rio favoreceu a agricultura no Egito Antigo e na Núbia?", "options": ["Congo", "Amazonas", "São Francisco", "Nilo"], "answer": 3, "unit": 9}, {"q": "Qual reino se destacou na antiga Núbia?", "options": ["Portugal", "Cuxe", "França", "Castela"], "answer": 1, "unit": 9}, {"q": "Qual alternativa apresenta contribuições africanas à cultura brasileira?", "options": ["Somente costumes portugueses", "Apenas construções europeias", "Línguas, músicas, crenças e culinária", "Exclusivamente tecnologias industriais"], "answer": 2, "unit": 9}, {"q": "Quem são os griôs em diferentes sociedades da África Ocidental?", "options": ["Transmissores de histórias e tradições", "Governadores de capitanias", "Navegadores portugueses", "Administradores de engenhos"], "answer": 0, "unit": 9}, {"q": "O que significa diáspora africana?", "options": ["União política dos reinos africanos", "Criação das capitanias", "Fundação do Egito", "Dispersão de populações africanas pelo mundo"], "answer": 3, "unit": 9}, {"q": "Qual manifestação cultural brasileira possui fortes raízes africanas?", "options": ["Torneios medievais", "Capoeira", "Ópera italiana", "Dança de corte francesa"], "answer": 1, "unit": 9}, {"q": "Por que se discute a devolução de objetos culturais africanos de museus estrangeiros?", "options": ["Porque todos foram feitos na Europa", "Porque não possuem valor histórico", "Porque muitos foram retirados durante a dominação colonial", "Porque todos foram doados livremente"], "answer": 2, "unit": 9}, {"q": "O que existia no território brasileiro antes da chegada dos portugueses?", "options": ["Diversos povos indígenas com sociedades próprias", "Somente cidades portuguesas", "Um único povo com uma única língua", "Nenhuma população"], "answer": 0, "unit": 10}, {"q": "Qual era um interesse econômico português no início da colonização?", "options": ["Criar indústrias automobilísticas", "Promover a independência", "Construir ferrovias", "Explorar recursos e obter riquezas"], "answer": 3, "unit": 10}, {"q": "Por que o pau-brasil era valorizado comercialmente?", "options": ["Porque produzia ouro", "Porque fornecia madeira e corante vermelho", "Porque continha petróleo", "Porque produzia algodão"], "answer": 1, "unit": 10}, {"q": "O que era o escambo na exploração inicial do pau-brasil?", "options": ["Pagamento de salários em moeda", "Cobrança de impostos sobre navios", "Troca de objetos e bens por trabalho ou outros produtos", "Venda de capitanias aos indígenas"], "answer": 2, "unit": 10}, {"q": "Por que Portugal intensificou a ocupação do Brasil a partir da década de 1530?", "options": ["Para ampliar o controle do território e sua exploração econômica", "Para entregar o Brasil à França", "Para encerrar a exploração", "Para proclamar a República"], "answer": 0, "unit": 10}, {"q": "Em que ano foi implantado o sistema de capitanias hereditárias?", "options": ["1500", "1534", "1549", "1822"], "answer": 1, "unit": 10}, {"q": "O que eram as capitanias hereditárias?", "options": ["Aldeias administradas por jesuítas", "Províncias independentes", "Grandes faixas de terra concedidas a donatários", "Territórios exclusivamente holandeses"], "answer": 2, "unit": 10}, {"q": "Quem eram os donatários?", "options": ["Pessoas que recebiam direitos de administrar capitanias", "Chefes indígenas eleitos por Portugal", "Representantes holandeses", "Trabalhadores dos engenhos"], "answer": 0, "unit": 10}, {"q": "Por que as capitanias eram chamadas hereditárias?", "options": ["Porque eram administradas por padres", "Porque pertenciam aos indígenas", "Porque eram vendidas anualmente", "Porque a concessão podia passar aos herdeiros"], "answer": 3, "unit": 10}, {"q": "Qual era uma responsabilidade dos donatários?", "options": ["Declarar a independência", "Promover ocupação, defesa e exploração das terras", "Entregar as terras à França", "Impedir povoações"], "answer": 1, "unit": 10}, {"q": "Por que muitas capitanias enfrentaram dificuldades?", "options": ["Porque receberam investimentos ilimitados", "Porque o açúcar era proibido", "Por custos, distâncias e conflitos ligados à colonização", "Porque o Brasil era independente"], "answer": 2, "unit": 10}, {"q": "Quais capitanias tiveram destaque econômico no início?", "options": ["Pernambuco e São Vicente", "Amazonas e Acre", "Goiás e Mato Grosso", "Paraná e Santa Catarina"], "answer": 0, "unit": 10}, {"q": "O que Portugal criou em 1549 para coordenar a administração colonial?", "options": ["A República", "O Império", "O Parlamento brasileiro", "O governo-geral"], "answer": 3, "unit": 10}, {"q": "Quem foi o primeiro governador-geral do Brasil?", "options": ["Maurício de Nassau", "Tomé de Sousa", "Pedro Álvares Cabral", "Tiradentes"], "answer": 1, "unit": 10}, {"q": "Qual cidade foi fundada em 1549 para sediar o governo-geral?", "options": ["Recife", "Rio de Janeiro", "Salvador", "São Paulo"], "answer": 2, "unit": 10}, {"q": "A criação do governo-geral extinguiu imediatamente todas as capitanias?", "options": ["Não, os sistemas coexistiram", "Sim, todas foram extintas em 1549", "Sim, o Brasil passou à Holanda", "Sim, tornaram-se países independentes"], "answer": 0, "unit": 10}, {"q": "Qual era um objetivo da catequese promovida pelos jesuítas?", "options": ["Organizar invasões holandesas", "Governar a França Antártica", "Proclamar a independência", "Converter indígenas ao cristianismo"], "answer": 3, "unit": 10}, {"q": "Qual foi uma consequência da colonização para muitos povos indígenas?", "options": ["Fim dos conflitos", "Perda de terras, doenças e trabalho forçado", "Autonomia garantida a todos", "Governo igualitário português-indígena"], "answer": 1, "unit": 10}, {"q": "Qual atividade econômica ganhou grande importância no século XVI colonial?", "options": ["Indústria automobilística", "Extração de petróleo", "Produção de açúcar em engenhos", "Produção industrial de soja"], "answer": 2, "unit": 10}, {"q": "Qual alternativa descreve corretamente as disputas estrangeiras pelo Brasil colonial?", "options": ["Franceses tentaram criar colônias e holandeses ocuparam áreas açucareiras do Nordeste", "Franceses fundaram o governo-geral", "Holandeses criaram as capitanias hereditárias", "Franceses e holandeses nunca tentaram ocupar terras brasileiras"], "answer": 0, "unit": 10}];let current=0,answers=Array(data.length).fill(null),finished=false;const app=document.getElementById('app');function render(){if(finished){let score=answers.reduce((s,a,i)=>s+(a===data[i].answer),0);app.innerHTML=`<div class="eyebrow">RESULTADO FINAL</div><h1>Você concluiu o quiz!</h1><div class="score">${score}/30</div><p style="text-align:center">${Math.round(score/30*100)}% de acertos. Confira as respostas abaixo.</p><div id="review"></div><div class="actions"><button class="action" onclick="restart()">Refazer o quiz</button><button class="action secondary" onclick="window.print()">Imprimir resultado</button></div>`;document.getElementById('review').innerHTML=data.map((q,i)=>`<div class="review"><strong>${i+1}. ${q.q}</strong><div class="${answers[i]===q.answer?'correct':'wrong'}">${answers[i]===q.answer?'✓ Acertou':'✕ Sua resposta: '+q.options[answers[i]]}</div>${answers[i]!==q.answer?'<div>Resposta correta: '+q.options[q.answer]+'</div>':''}</div>`).join('');return;}const q=data[current];app.innerHTML=`<div class="eyebrow">HISTÓRIA • UNIDADE ${q.unit}</div><h1>Desafio de História</h1><p>África e colonização do Brasil: responda às 30 questões e descubra sua pontuação.</p><div class="meta"><span>Questão ${current+1} de ${data.length}</span><span>${answers.filter(a=>a!==null).length} respondidas</span></div><div class="progress"><div class="bar" style="width:${(current+1)/data.length*100}%"></div></div><h2>${q.q}</h2><div id="opts"></div><div class="actions"><button class="action secondary" ${current===0?'disabled':''} onclick="previous()">Anterior</button><button class="action" id="next" ${answers[current]===null?'disabled':''} onclick="next()">${current===data.length-1?'Finalizar quiz':'Próxima →'}</button></div>`;document.getElementById('opts').innerHTML=q.options.map((o,i)=>`<button class="option ${answers[current]===i?'selected':''}" onclick="selectAnswer(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('');}function selectAnswer(i){answers[current]=i;render()}function previous(){if(current>0){current--;render()}}function next(){if(answers[current]===null)return;if(current===data.length-1){finished=true}else current++;render();window.scrollTo(0,0)}function restart(){answers=Array(data.length).fill(null);current=0;finished=false;render();window.scrollTo(0,0)}render();</script></body></html>
