<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cantinho das Atividades • Tia Nice</title><style>:root{font-family:system-ui,sans-serif;color:#382a48;background:#fff9f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#fbe2f0,#e6e5ff,#d9f5ed);padding:35px 20px;text-align:center}h1{font-size:clamp(27px,5vw,48px);margin:6px}p{line-height:1.5}.mascot{font-size:76px;display:block}main{max-width:1060px;margin:auto;padding:22px}button,select,input{font:inherit;border:1px solid #ddd;border-radius:12px;padding:12px}button{cursor:pointer;background:white}button.active{background:#6746a4;color:white}nav,.filters{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.tile,.activity{background:white;border:1px solid #eadfec;border-radius:19px;padding:20px;box-shadow:0 4px 14px #382a4810}.tile{cursor:pointer;text-align:left}.tile .emoji{font-size:34px}.tile strong{display:block;margin:8px 0}.activity a{display:inline-block;background:#6746a4;color:white;text-decoration:none;padding:10px 14px;border-radius:11px}.muted{color:#70677a}.hidden{display:none}.filters input{flex:1;min-width:180px}footer{text-align:center;padding:25px;color:#766d7c}#empty{background:#f4eefd;padding:20px;border-radius:14px}</style></head><body><header><svg width="145" height="150" viewBox="0 0 145 150" aria-label="Bonequinha com cabelo cacheado e óculos redondos" role="img"><g fill="#3c2937"><circle cx="42" cy="38" r="22"/><circle cx="70" cy="24" r="22"/><circle cx="98" cy="39" r="22"/><circle cx="28" cy="64" r="19"/><circle cx="113" cy="63" r="19"/><circle cx="47" cy="19" r="14"/><circle cx="94" cy="19" r="14"/></g><ellipse cx="71" cy="70" rx="39" ry="44" fill="#bb7e59"/><path d="M35 57Q34 23 70 30Q106 20 108 58Q96 46 86 39Q69 56 35 57" fill="#3c2937"/><g stroke="#453442" stroke-width="3.5" fill="none"><circle cx="55" cy="72" r="14"/><circle cx="88" cy="72" r="14"/><path d="M69 72h5M40 70l-9-4M102 70l9-4"/></g><path d="M62 94Q72 102 82 94" stroke="#783c51" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M35 150Q37 114 71 114Q106 114 108 150" fill="#8a65cb"/><path d="M57 115l14 19 15-19" fill="#fff"/></svg><h1>Cantinho das Atividades</h1><p><strong>✨ Tia Nice ✨</strong></p><p>Aprender, brincar e descobrir! • 1º ao 5º ano</p></header><main><h2>Escolha uma disciplina</h2><div id="subjects" class="grid"></div><h2 id="sectionTitle">Todas as atividades</h2><div class="filters"><select id="grade" aria-label="Ano escolar"><option value="">Todos os anos</option><option>1º ano</option><option>2º ano</option><option>3º ano</option><option>4º ano</option><option>5º ano</option></select><input id="search" placeholder="🔎 Buscar atividade pelo nome"><button id="reset">Limpar filtros</button></div><div id="activities" class="grid"></div><p id="empty" class="muted">As atividades aparecerão aqui quando forem adicionadas ao portal. 🌷</p></main><footer>Feito com carinho para aprender 💜 • Tia Nice</footer><script src="atividades.js?v=2"></script><script>const subjects=[['Português','📖'],['Matemática','🔢'],['Ciências','🔬'],['História','🏛️'],['Geografia','🌎'],['Artes','🎨'],['Inglês','🇬🇧'],['Revisões','⭐']];let selected='';const data=Array.isArray(window.ATIVIDADES)?window.ATIVIDADES:[];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('subjects').innerHTML=subjects.map(([s,e])=>`<button class="tile" data-subject="${s}"><span class="emoji">${e}</span><strong>${s}</strong><span class="muted">Explorar atividades →</span></button>`).join('');document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.subject?'':b.dataset.subject;render();document.getElementById('sectionTitle').scrollIntoView({behavior:'smooth'})});document.getElementById('grade').onchange=render;document.getElementById('search').oninput=render;document.getElementById('reset').onclick=()=>{selected='';document.getElementById('grade').value='';document.getElementById('search').value='';render()};function render(){document.querySelectorAll('[data-subject]').forEach(b=>b.classList.toggle('active',b.dataset.subject===selected));document.getElementById('sectionTitle').textContent=selected||'Todas as atividades';let grade=document.getElementById('grade').value,q=document.getElementById('search').value.toLocaleLowerCase('pt-BR');let items=data.filter(a=>(!selected||a.disciplina===selected)&&(!grade||a.ano===grade)&&(!q||(a.titulo+' '+a.disciplina+' '+a.ano).toLocaleLowerCase('pt-BR').includes(q)));document.getElementById('activities').innerHTML=items.map(a=>`<article class="activity"><span class="muted">${escapeHtml(a.disciplina)} • ${escapeHtml(a.ano)}</span><h3>${escapeHtml(a.titulo)}</h3><p>${escapeHtml(a.descricao||'Atividade interativa')}</p><a href="${encodeURI(a.arquivo)}" target="_blank" rel="noopener">Abrir atividade ↗</a> <button onclick="navigator.clipboard.writeText(new URL('${encodeURI(a.arquivo)}',location.href).href).then(()=>alert('Link copiado!')).catch(()=>alert('Abra a atividade e copie o endereço.'))">Compartilhar 🔗</button></article>`).join('');document.getElementById('empty').classList.toggle('hidden',items.length>0)}render()</script></body></html>
